name: build-exe
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build pulse-exe/Pulse.csproj -c Release -o dist-exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/Pulse-Guard.exe
          tag_name: ${{ github.event.release.tag_name }}
